syntax = "proto3";
package service;
option go_package = "github.com/govision-hackvidia/hackvidia-backend/protobuf";

message MllmRequest {
    string text = 1;
    optional bytes image = 2;
}

message MllmResponse {
    string text = 1;
}

service MllmService {
    rpc Chat (MllmRequest) returns (MllmResponse) {}
}